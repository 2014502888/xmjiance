name: Build dylibs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile xmfjc.dylib (arm64)
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -miphoneos-version-min=13.0 -fobjc-arc \
            -framework Foundation -framework UIKit \
            -o xmfjc.dylib xmfjc.m
          ls -la xmfjc.dylib
          file xmfjc.dylib

      - name: Compile houtaicz.dylib (arm64)
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -miphoneos-version-min=13.0 -fobjc-arc \
            -framework Foundation -framework UIKit \
            -framework AVFoundation -framework CoreLocation \
            -o houtaicz.dylib houtaicz.m
          ls -la houtaicz.dylib
          file houtaicz.dylib

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xm-dylibs
          path: |
            xmfjc.dylib
            houtaicz.dylib
          if-no-files-found: error
